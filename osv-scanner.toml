# Acceptances for the shared osv-scan lane. See ci-workflows/REMEDIATION.md.
#
# Two entries, both reached only through lume's exact npm pins, both dated.
# Everything else this repo was failing on — 8 of 9 advisories, including a
# CVSS 8.7 in linkify-it — was FIXED at rungs 1 and 2, not accepted.
#
# On the lume version choice, because it is a trade and not a free win:
#
#   lume v3.1.4  markdown-it 14.1.0 (5.5 + 5.3)  esbuild 0.27.2 (clean)  = 2 findings
#   lume v3.2.5  markdown-it 14.1.1 (5.3)        esbuild 0.28.0 (2.5)    = 2 findings
#
# Bumping lume clears one markdown-it advisory and introduces the esbuild one,
# because the esbuild advisory was introduced in 0.27.3 and v3.1.4 happened to
# pin 0.27.2 — below the range by luck, not by design. Both versions leave two
# findings; v3.2.5 is kept because its worst is 5.3 rather than 5.5, and
# because sitting on the newest lume is where a real upstream fix will arrive.
# v3.2.2 was checked too and is no better: esbuild 0.27.3, already in range.

[[IgnoredVulns]]
id = "GHSA-6v5v-wf23-fmfq"
ignoreUntil = 2026-10-31
reason = "MARKDOWN-IT. 14.1.1, fixed in 14.2.0. Reached only through lume, whose deps/markdown_it.ts pins npm:markdown-it@14.1.1 EXACTLY — checked v3.2.2, v3.2.4 and v3.2.5, the newest published, and all three carry the same exact pin, so rung 2 is exhausted. Rung 3 was attempted and does not apply: promoting markdown-it to a direct import in deno.json leaves the lock resolving 14.1.1, because an import-map entry can only redirect a BARE specifier and lume's is fully qualified. Nothing in src/ imports markdown-it directly. Remaining options were this or vendoring lume. Severity 5.3, the lowest of the nine findings this lane surfaced here. REMOVE THIS when lume's deps/markdown_it.ts moves to >=14.2.0 — check with: curl -s https://deno.land/x/lume@<newest>/deps/markdown_it.ts | grep markdown-it, and get <newest> from https://cdn.deno.land/lume/meta/versions.json"

[[IgnoredVulns]]
id = "GHSA-g7r4-m6w7-qqqr"
ignoreUntil = 2026-10-31
reason = "ESBUILD. 0.28.0, affected range is introduced 0.27.3 / fixed 0.28.1 — so this is narrow, and no lume release pins inside the fixed window: v3.2.2 pins 0.27.3, v3.2.4 and v3.2.5 pin 0.28.0. Same exact-pin structure as the markdown-it entry above, so rungs 1-3 fail for the same reason: nothing in src/ imports esbuild, and an import-map entry cannot redirect lume's fully-qualified specifier. Introduced BY the lume v3.1.4 -> v3.2.5 bump in this PR, deliberately and with the trade recorded in the header comment. CVSS 2.5, and the vector is local with integrity-only impact (CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:N/I:L/A:N) — it needs local access to a build host, which is a narrower exposure than the 8.7 this bump helped clear. REMOVE THIS when lume pins esbuild >=0.28.1 — check with: curl -s https://deno.land/x/lume@<newest>/deps/esbuild.ts | grep esbuild, and get <newest> from https://cdn.deno.land/lume/meta/versions.json"
